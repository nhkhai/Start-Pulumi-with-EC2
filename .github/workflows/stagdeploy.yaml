name: StaDeploy 
on: 
  push: 
    branches: 
      - "dev"

jobs: 
  DevDeploy: 
    name: DevDeploy
    runs-on: ubuntu-24.04
    permissions: 
      id-token: write
      contents: read
    steps: 
      - uses: actions/checkout@v4 
      - name: Configure AWS credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ sercrets.ActionsRoleArn }}
          aws-region: ap-southeast-1 
      
      # - name: Zip file 
      #   run: | 
      #     mkdir -p build 
      #     cp 
    
      - uses: pulumi/actions@v5
        with: 
          command: up 
          stack-name: veraz00/dev 
          work-dir: infra
          refresh: true 
        env: 
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GIT_SHA: ${{ github.sha }}