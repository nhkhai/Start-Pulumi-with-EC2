name: Deploy EC2 App

on:
  push:
    branches:
      - "dev"
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - destroy
      force_replace:
        description: 'Force replace EC2 instance (needed for user_data changes)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy EC2 Infrastructure' || 'Deploy to EC2' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
            fetch-depth: 2 # git diff: if __main__.py is the same, no replacement needed

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install dependencies
        working-directory: ./infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if instance exists
        id: check_instance
        working-directory: ./infra
        run: |
          # Check if instance exists in Pulumi state and AWS
          echo "🔍 Checking Pulumi stack outputs..."
          pulumi stack select dev
          INSTANCE_ID=$(pulumi stack output instance_id 2>/dev/null | tr -d '"')
          echo "📋 Instance ID from Pulumi: '$INSTANCE_ID'"
          
          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "undefined" ] && [ "$INSTANCE_ID" != "null" ]; then 
              echo "instance_exists=true" >> $GITHUB_OUTPUT
              echo "📝 Instance exists - replacement possible"
          else
            echo "instance_exists=false" >> $GITHUB_OUTPUT
            echo "📝 No instance ID in Pulumi state - normal deployment"
          fi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Check if replacement needed
        id: check_replacement
        run: |
          # Check if force replace is requested
          if [ "${{ github.event.inputs.force_replace }}" = "true" ]; then
            echo "replacement_needed=true" >> $GITHUB_OUTPUT
            echo "🔄 Force replace requested"
          else
            # Check if user_data/HTML content changed
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              if git diff HEAD~1 infra/__main__.py | grep -q "user_data_script\|cat > /var/www/html\|sed -i.*html\|<html>\|<style>"; then
                echo "replacement_needed=true" >> $GITHUB_OUTPUT
                echo "🔄 User data/HTML changes detected"
              else
                echo "replacement_needed=false" >> $GITHUB_OUTPUT
                echo "📝 No user data changes"
              fi
            else
              echo "replacement_needed=false" >> $GITHUB_OUTPUT
              echo "📝 First deployment"
            fi
          fi

      - name: Deploy infrastructure (with replacement)
        if: github.event.inputs.action != 'destroy' && steps.check_instance.outputs.instance_exists == 'true' && steps.check_replacement.outputs.replacement_needed == 'true'
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: infra
          refresh: true
          replace: urn:pulumi:dev::Start-Pulumi-with-EC2::aws:ec2/instance:Instance::web-server-instance
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy infrastructure (normal)
        if: github.event.inputs.action != 'destroy' && (steps.check_instance.outputs.instance_exists == 'false' || steps.check_replacement.outputs.replacement_needed == 'false')
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: infra
          refresh: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Show deployment info
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra
        run: |
          echo "🚀 Deployment completed!"
          echo ""
          PUBLIC_IP=$(pulumi stack output public_ip --stack dev)
          echo "🌐 Your web application is available at: http://$PUBLIC_IP"
          echo ""
          echo "Instance details:"
          echo "  Instance ID: $(pulumi stack output instance_id --stack dev)"
          echo "  Public DNS: $(pulumi stack output public_dns --stack dev)"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Destroy infrastructure
        if: github.event.inputs.action == 'destroy'
        uses: pulumi/actions@v5
        with:
          command: destroy
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Confirm destruction
        if: github.event.inputs.action == 'destroy'
        run: |
          echo "🎯 Infrastructure destruction completed!"
          echo ""
          echo "✅ All resources have been destroyed."
          echo "💰 No more AWS charges will be incurred."