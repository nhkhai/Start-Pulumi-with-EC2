name: Deploy EC2 App

on:
  push:
    branches:
      - "dev"
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - destroy
      force_replace:
        description: 'Force replace EC2 instance (needed for user_data changes)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy EC2 Infrastructure' || 'Deploy to EC2' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
            fetch-depth: 2 # git diff: if __main__.py is the same, no replacement needed

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install dependencies
        working-directory: ./infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if user_data changed
        id: check_userdata
        run: |
          if git diff HEAD~1 --name-only | grep -q "infra/__main__.py"; then
            if git diff HEAD~1 infra/__main__.py | grep -q "user_data_script\|cat > /var/www/html"; then
              echo "userdata_changed=true" >> $GITHUB_OUTPUT
              echo "🔄 User data script changes detected - will force instance replacement"
            else
              echo "userdata_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "userdata_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy infrastructure (with replacement)
        if: github.event.inputs.action != 'destroy' && (github.event.inputs.force_replace == 'true' || steps.check_userdata.outputs.userdata_changed == 'true')
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: infra
          refresh: true
          replace: urn:pulumi:dev::Start-Pulumi-with-EC2::aws:ec2/instance:Instance::web-server-instance
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy infrastructure (normal)
        if: github.event.inputs.action != 'destroy' && github.event.inputs.force_replace != 'true' && steps.check_userdata.outputs.userdata_changed != 'true'
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: infra
          refresh: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Show deployment info
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra
        run: |
          echo "🚀 Deployment completed!"
          echo ""
          PUBLIC_IP=$(pulumi stack output public_ip --stack dev)
          echo "🌐 Your web application is available at: http://$PUBLIC_IP"
          echo ""
          echo "Instance details:"
          echo "  Instance ID: $(pulumi stack output instance_id --stack dev)"
          echo "  Public DNS: $(pulumi stack output public_dns --stack dev)"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Destroy infrastructure
        if: github.event.inputs.action == 'destroy'
        uses: pulumi/actions@v5
        with:
          command: destroy
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Confirm destruction
        if: github.event.inputs.action == 'destroy'
        run: |
          echo "🎯 Infrastructure destruction completed!"
          echo ""
          echo "✅ All resources have been destroyed."
          echo "💰 No more AWS charges will be incurred."