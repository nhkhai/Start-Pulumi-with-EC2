name: PR Preview (Dev)

on:
  pull_request:
    branches:
      - "dev" # Triggers when a PR is opened targeting the 'dev' branch

jobs:
  PulumiPreview:
    name: Pulumi Preview
    runs-on: ubuntu-latest # ubuntu-24.04 is fine, latest is common
    permissions:
      id-token: write      # For AWS OIDC
      contents: read       # To checkout the code
      pull-requests: write # To comment on the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ActionsRoleArn }}
          aws-region: ap-southeast-1

      # OPTIONAL: This step validates that your app code can be packaged.
      # It doesn't upload anything, just creates the zip file.
      - name: Package application code for validation
        run: zip -r app.zip ./app

      - name: Run Pulumi Preview
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: veraz00/dev # Or just 'dev' if the org is in the token
          work-dir: infra        # Your Pulumi code is in the 'infra' subdirectory
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}