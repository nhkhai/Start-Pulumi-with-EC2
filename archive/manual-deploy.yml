name: Manual EC2 Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      force_recreate:
        description: 'Force recreate EC2 instance'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    name: Manual Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install dependencies
        working-directory: ./infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare application package
        run: |
          echo "Creating application package for ${{ inputs.environment }}..."
          
          mkdir -p package/app
          cp app/index.html.template package/app/index.html.template
          cp app/setup.sh package/app/setup.sh
          chmod +x package/app/setup.sh
          
          cd package
          zip -r ../app.zip app/
          echo "Application package created successfully"

      - name: Force destroy infrastructure (if requested)
        if: ${{ inputs.force_recreate == true }}
        uses: pulumi/actions@v5
        with:
          command: destroy
          stack-name: ${{ inputs.environment }}
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy infrastructure with Pulumi
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ inputs.environment }}
          work-dir: infra
          refresh: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Upload application to S3
        working-directory: ./infra
        run: |
          BUCKET_NAME=$(pulumi stack output s3_bucket_name --stack ${{ inputs.environment }})
          echo "Uploading to bucket: $BUCKET_NAME"
          aws s3 cp ../app.zip s3://$BUCKET_NAME/app.zip
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Display deployment results
        working-directory: ./infra
        run: |
          echo "🎉 Deployment to ${{ inputs.environment }} completed!"
          echo ""
          echo "📋 Infrastructure Details:"
          pulumi stack output --stack ${{ inputs.environment }}
          echo ""
          INSTANCE_ID=$(pulumi stack output instance_id --stack ${{ inputs.environment }})
          PUBLIC_IP=$(pulumi stack output public_ip --stack ${{ inputs.environment }})
          
          echo "🌐 Access your application:"
          echo "  • URL: http://$PUBLIC_IP"
          echo "  • Instance ID: $INSTANCE_ID"
          echo ""
          echo "⏳ Note: Application may take 2-3 minutes to be fully available after first deployment."
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
