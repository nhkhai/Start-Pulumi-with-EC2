<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EC2 Instance Details</title>
    <style>
        body { font-family: sans-serif; background-color: #222; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { border: 1px solid #00ff99; padding: 40px; background: #333; border-radius: 12px; box-shadow: 0 0 15px rgba(0, 255, 153, 0.2); text-align: left; }
        h1 { color: #00ff99; }
        p { font-size: 1.1rem; line-height: 1.6; }
        b { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EC2 Instance Details</h1>
        <p><b>Instance Name:</b> __INSTANCE_NAME__</p>
        <p><b>Instance ID:</b> __INSTANCE_ID__</p>
        <p><b>Instance Type:</b> __INSTANCE_TYPE__</p>
        <p><b>Availability Zone:</b> __AVAILABILITY_ZONE__</p>
        <p><b>Region:</b> __REGION__</p>
    </div>
</body>
</html>
